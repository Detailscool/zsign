[package]
name = "zsign-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
tempfile = "3"
zsign-gui-core = { path = "../core" }
plume_core = { path = "../vendor/impactor/crates/plume_core", features = ["tweaks"] }
omnisette = { path = "../vendor/impactor/3rdparty/omnisette", features = ["remote-anisette-v3"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }

[patch.crates-io]
apple-codesign = { path = "../vendor/impactor/3rdparty/apple-codesign-0.29.0" }
